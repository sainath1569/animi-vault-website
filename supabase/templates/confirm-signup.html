<!-- Supabase → Authentication → Email Templates → "Confirm signup".
     Subject: Your AniBeast verification code -->
<div style="background:#0b0b0f;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#f4f4f6">
  <div style="max-width:440px;margin:0 auto;background:#14141b;border:1px solid #2a2a36;border-radius:16px;padding:32px;text-align:center">
    <p style="margin:0 0 4px;font-size:22px;font-weight:800">Ani<span style="color:#e8304f">Beast</span></p>
    <p style="margin:24px 0 8px;font-size:16px">Your verification code</p>
    <p style="margin:0;font-size:36px;font-weight:700;letter-spacing:10px;font-family:Consolas,monospace">{{ .Token }}</p>
    <p style="margin:24px 0 0;font-size:13px;color:#a3a3b2">Enter this code on the sign-up page. It expires in 10 minutes.</p>
    <p style="margin:8px 0 0;font-size:13px;color:#6e6e7e">If you didn't create an AniBeast account, ignore this email.</p>
  </div>
</div>
